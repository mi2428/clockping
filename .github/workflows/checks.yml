name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HOME: /opt/cargo
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  check:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI shell scripts
        run: shellcheck .github/scripts/*.sh
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release_metadata.sh
      - name: Install completion shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            .cargo-linux/amd64
            target
          key: linux-amd64-rust-1.95-check-${{ hashFiles('Cargo.lock', 'src/**', 'tests/**', 'build.rs') }}
          restore-keys: linux-amd64-rust-1.95-check-
      - name: Check Git build metadata in disposable fixtures
        run: python3 tests/build_metadata.py
      - run: make check
      - name: Check release gate without publishing
        run: python3 tests/release_gate.py
      - name: Check tracked completions
        run: |
          cargo run --quiet -- completion bash | diff - completions/clockping.bash
          cargo run --quiet -- completion zsh | diff - completions/_clockping
          cargo run --quiet -- completion fish | diff - completions/clockping.fish
          python3 tests/completion_fish.py
      - name: Check release metadata policy
        run: python3 .github/scripts/test_release_metadata.py
      - name: Check loopback HTTP and TLS behavior
        run: |
          cargo build --locked
          python3 tests/http_proxy_contract.py
          python3 tests/tls_smoke.py target/debug/clockping target
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build E2E image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: e2e-test
          load: true
          tags: clockping-test:latest
          cache-from: type=gha,scope=clockping-e2e
          cache-to: type=gha,mode=max,scope=clockping-e2e
      - name: Run protocol E2E tests
        run: docker compose -f docker-compose.test.yml up --no-build --pull never --abort-on-container-exit --exit-code-from sut
      - name: Clean up E2E containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
      - name: Build Linux distribution and checksums
        run: |
          make dist OS=linux ARCH=amd64
          mv dist/checksums.txt dist/checksums-linux-amd64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-linux-amd64
          path: dist/
          if-no-files-found: error
      - name: Build release image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: release
          platforms: linux/amd64
          load: true
          tags: clockping:ci
          cache-from: type=gha,scope=clockping-release
          cache-to: type=gha,mode=max,scope=clockping-release
      - run: docker run --rm clockping:ci --version

  publish:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and compute image metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release_metadata.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-linux-amd64
          path: dist
      - name: Verify distribution checksums
        run: cd dist && sha256sum --check checksums-linux-amd64.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Linux image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CLOCKPING_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            CLOCKPING_GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            CLOCKPING_GIT_COMMIT_DATE=${{ steps.meta.outputs.git_commit_date }}
            CLOCKPING_GIT_DESCRIBE=${{ steps.meta.outputs.git_describe }}
          cache-from: type=gha,scope=clockping-release
          cache-to: type=gha,mode=max,scope=clockping-release
      - name: Publish Linux GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              | jq -e --argjson expected "$PRERELEASE" '.isDraft == false and .isPrerelease == $expected'
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}" dist/*
          fi
